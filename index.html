<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Sinners Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: #121212; color: #fff; font-family: sans-serif; padding: 20px;">

  <h2>Проверка связи с базой</h2>
  <div id="status" style="margin-top: 10px; font-size: 14px;">Подключаемся к Supabase...</div>
  
  <ul id="movies-list" style="margin-top: 20px; line-height: 1.8; padding-left: 20px;"></ul>

  <script>
    const SUPABASE_URL = 'https://otcnrvimrqyppmfjnqpv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_niMZLppQ5UZwkQWc6Pj29g_910mdIkQ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function testLoad() {
      const status = document.getElementById('status');
      const list = document.getElementById('movies-list');

      // Пробуем забрать первые 5 фильмов
      const { data, error } = await supabase
        .from('movies')
        .select('id, title, year')
        .limit(5);

      if (error) {
        status.innerText = '❌ Ошибка подключения: ' + error.message;
        status.style.color = '#ff6b6b';
        return;
      }

      status.innerText = `✅ Связь есть! Загружено фильмов: ${data.length}`;
      status.style.color = '#51cf66';

      data.forEach(movie => {
        const li = document.createElement('li');
        li.textContent = `${movie.title || 'Без названия'} (${movie.year || 'год не указан'})`;
        list.appendChild(li);
      });
    }

    testLoad();
  </script>
</body>
</html>
