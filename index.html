<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Sinners</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #0d0d0f;
      --card-bg: #16161a;
      --accent: #e50914;
      --text: #ffffff;
      --subtext: #8e8e93;
      --border: rgba(255, 255, 255, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
      padding-top: 0;
      padding-bottom: 50px;
    }

    /* Прилипающая шапка с поиском */
    .sticky-header {
      position: sticky;
      top: 0;
      background: rgba(13, 13, 15, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 50;
      padding: 12px 0 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .header-top h1 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .badge {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--subtext);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 8px;
    }

    /* Поисковая строка */
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      font-size: 14px;
      opacity: 0.5;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 36px 10px 34px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-input::placeholder {
      color: #666;
    }

    .search-clear {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: #888;
      font-size: 14px;
      padding: 4px;
      display: none;
      cursor: pointer;
    }

    /* Мобильная сетка 2 колонки */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    /* Карточка */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .card:active {
      transform: scale(0.97);
    }

    .poster-box {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: linear-gradient(145deg, #1f1f26, #111114);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      text-align: center;
    }

    .poster-icon {
      font-size: 30px;
      opacity: 0.3;
      margin-bottom: 6px;
    }

    .poster-title-preview {
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-year {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
    }

    .card-info {
      padding: 8px 10px 10px 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      font-size: 11px;
      color: var(--subtext);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Индикатор дозагрузки / Пустой результат */
    .status-msg {
      text-align: center;
      padding: 24px 0;
      font-size: 13px;
      color: var(--subtext);
    }

    /* Модальная шторка (Bottom Sheet) */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      width: 100%;
      background: #18181d;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      border-top: 1px solid var(--border);
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      max-height: 85vh;
      overflow-y: auto;
    }

    .overlay.active .sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: #444;
      border-radius: 2px;
      margin: 0 auto 16px auto;
    }

    .sheet-title {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .sheet-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .sheet-meta-item {
      background: rgba(255, 255, 255, 0.05);
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      color: #ccc;
    }

    .sheet-actors {
      font-size: 12px;
      line-height: 1.5;
      color: #bbb;
      margin-bottom: 20px;
      background: rgba(0, 0, 0, 0.25);
      padding: 10px;
      border-radius: 8px;
    }

    .sheet-actors span {
      color: var(--subtext);
      display: block;
      margin-bottom: 2px;
    }

    .btn-watch {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-watch:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <!-- Фиксированная шапка с поиском -->
  <div class="sticky-header">
    <div class="header-top">
      <h1>THE SINNERS</h1>
      <div id="status-badge" class="badge">Загрузка...</div>
    </div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input 
        id="search-input" 
        class="search-input" 
        type="text" 
        placeholder="Поиск по названию или студии..."
        autocomplete="off"
      >
      <button id="search-clear" class="search-clear" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <!-- Сетка фильмов -->
  <div id="catalog-grid" class="grid"></div>

  <!-- Триггер бесконечного скролла и статус -->
  <div id="scroll-status" class="status-msg">Загрузка релизов...</div>
  <div id="scroll-sentinel" style="height: 20px;"></div>

  <!-- Шторка подробностей -->
  <div id="sheet-overlay" class="overlay" onclick="closeSheet()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <h2 id="sheet-title" class="sheet-title"></h2>
      <div class="sheet-meta-row" id="sheet-meta"></div>
      <div class="sheet-actors" id="sheet-actors"></div>
      <button class="btn-watch" onclick="openChannelPost()">
        🎬 Смотреть в канале
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.BackButton) {
        tg.BackButton.onClick(() => closeSheet());
      }
    }

    const SUPABASE_URL = 'https://otcnrvimrqyppmfjnqpv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_niMZLppQ5UZwkQWc6Pj29g_910mdIkQ';

    const PAGE_SIZE = 24;
    let currentOffset = 0;
    let isLoading = false;
    let hasMore = true;
    let currentSearch = '';
    let debounceTimer = null;
    let currentTelegramUrl = '';

    const grid = document.getElementById('catalog-grid');
    const scrollStatus = document.getElementById('scroll-status');
    const statusBadge = document.getElementById('status-badge');
    const searchInput = document.getElementById('search-input');
    const searchClear = document.getElementById('search-clear');

    async function fetchMovies(isReset = false) {
      if (isLoading || (!hasMore && !isReset)) return;
      isLoading = true;

      if (isReset) {
        currentOffset = 0;
        hasMore = true;
        grid.innerHTML = '';
        scrollStatus.innerText = 'Поиск...';
      }

      let endpoint = `${SUPABASE_URL}/rest/v1/movies?select=id,title,year,studio,country,country_flag,duration,actors,telegram_url&order=id.desc&limit=${PAGE_SIZE}&offset=${currentOffset}`;

      if (currentSearch.trim()) {
        const query = encodeURIComponent(`*${currentSearch.trim()}*`);
        endpoint += `&or=(title.ilike.${query},studio.ilike.${query})`;
      }

      try {
        const res = await fetch(endpoint, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        const movies = await res.json();

        if (movies.length < PAGE_SIZE) {
          hasMore = false;
        }

        if (movies.length === 0 && isReset) {
          scrollStatus.innerText = 'Ничего не найдено 😕';
          statusBadge.innerText = '0 фильмов';
          isLoading = false;
          return;
        }

        renderCards(movies);
        currentOffset += movies.length;

        statusBadge.innerText = currentSearch 
          ? `Найдено: ${currentOffset}` 
          : `${currentOffset} фильмов`;

        scrollStatus.innerText = hasMore ? 'Прокрутите для загрузки...' : 'Архив просмотрен полностью';

      } catch (err) {
        scrollStatus.innerText = 'Ошибка загрузки сети';
      } finally {
        isLoading = false;
      }
    }

    function renderCards(movies) {
      movies.forEach(m => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => showMovieDetails(m);

        card.innerHTML = `
          <div class="poster-box">
            <span class="card-year">${m.year || ''}</span>
            <div>
              <div class="poster-icon">🎬</div>
              <div class="poster-title-preview">${m.title || 'Фильм'}</div>
            </div>
          </div>
          <div class="card-info">
            <div class="card-title">${m.title || 'Без названия'}</div>
            <div class="card-meta">
              ${m.country_flag ? m.country_flag + ' ' : ''}${m.studio || 'The Sinners'}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Слушатель ввода с паузой 400мс
    searchInput.addEventListener('input', (e) => {
      const val = e.target.value;
      searchClear.style.display = val ? 'block' : 'none';

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        currentSearch = val;
        fetchMovies(true);
      }, 400);
    });

    function clearSearch() {
      searchInput.value = '';
      currentSearch = '';
      searchClear.style.display = 'none';
      fetchMovies(true);
    }

    // Автоматическая подгрузка при скролле вниз
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !isLoading && hasMore) {
        fetchMovies();
      }
    }, { rootMargin: '200px' });

    observer.observe(document.getElementById('scroll-sentinel'));

    // Шторка с деталями
    function showMovieDetails(m) {
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
      if (tg?.BackButton) tg.BackButton.show();

      document.getElementById('sheet-title').innerText = m.title || 'Без названия';
      
      const meta = document.getElementById('sheet-meta');
      meta.innerHTML = `
        ${m.year ? `<div class="sheet-meta-item">📅 ${m.year}</div>` : ''}
        ${m.duration ? `<div class="sheet-meta-item">⏱ ${m.duration}</div>` : ''}
        ${m.country ? `<div class="sheet-meta-item">${m.country_flag || ''} ${m.country}</div>` : ''}
        ${m.studio ? `<div class="sheet-meta-item">🏢 ${m.studio}</div>` : ''}
      `;

      const actorsEl = document.getElementById('sheet-actors');
      actorsEl.innerHTML = m.actors ? `<span>В главных ролях:</span>${m.actors}` : '';
      actorsEl.style.display = m.actors ? 'block' : 'none';

      currentTelegramUrl = m.telegram_url || '';
      document.getElementById('sheet-overlay').classList.add('active');
    }

    function closeSheet() {
      document.getElementById('sheet-overlay').classList.remove('active');
      if (tg?.BackButton) tg.BackButton.hide();
    }

    function openChannelPost() {
      if (!currentTelegramUrl) {
        alert('Ссылка на этот релиз ещё не добавлена в базу');
        return;
      }
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      if (tg?.openTelegramLink) {
        tg.openTelegramLink(currentTelegramUrl);
      } else {
        window.open(currentTelegramUrl, '_blank');
      }
    }

    // Первый старт
    fetchMovies();
  </script>
</body>
</html>
