<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Sinners</title>
  
  <!-- Официальный SDK Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #0f0f11;
      --card-bg: #1a1a1e;
      --accent: #e50914;
      --text: #ffffff;
      --subtext: #8e8e93;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
      padding-bottom: 40px;
    }

    /* Шапка каталога */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px 14px 4px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .badge {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--subtext);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
    }

    /* Мобильная сетка 2 колонки */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    /* Карточка фильма */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .card:active {
      transform: scale(0.97);
    }

    /* Блок постера (пропорция 2:3) */
    .poster-box {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: linear-gradient(145deg, #25252b, #121215);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      text-align: center;
    }

    .poster-icon {
      font-size: 32px;
      opacity: 0.35;
      margin-bottom: 6px;
    }

    .poster-title-preview {
      font-size: 11px;
      font-weight: 600;
      color: #ccc;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-year {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
    }

    .card-info {
      padding: 8px 10px 10px 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      font-size: 11px;
      color: var(--subtext);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Выезжающая карточка (Bottom Sheet) */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      width: 100%;
      background: #1c1c21;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      border-top: 1px solid var(--border);
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      max-height: 80vh;
      overflow-y: auto;
    }

    .overlay.active .sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: #444;
      border-radius: 2px;
      margin: 0 auto 16px auto;
    }

    .sheet-title {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .sheet-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      color: var(--subtext);
      margin-bottom: 14px;
    }

    .sheet-meta-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .sheet-actors {
      font-size: 12px;
      line-height: 1.5;
      color: #bbb;
      margin-bottom: 20px;
    }

    .sheet-actors span {
      color: var(--subtext);
    }

    .btn-watch {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-watch:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>THE SINNERS</h1>
    <div id="movie-count" class="badge">Загрузка...</div>
  </div>

  <div id="catalog-grid" class="grid"></div>

  <!-- Модальная шторка фильма -->
  <div id="sheet-overlay" class="overlay" onclick="closeSheet(event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <h2 id="sheet-title" class="sheet-title"></h2>
      <div class="sheet-meta-row" id="sheet-meta"></div>
      <div class="sheet-actors" id="sheet-actors"></div>
      <button id="sheet-btn" class="btn-watch" onclick="openChannelPost()">
        🎬 Смотреть в канале
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand(); // Разворачиваем сразу на всю высоту экрана
    }

    const SUPABASE_URL = 'https://otcnrvimrqyppmfjnqpv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_niMZLppQ5UZwkQWc6Pj29g_910mdIkQ';
    let currentTelegramUrl = '';

    async function loadCatalog() {
      const endpoint = `${SUPABASE_URL}/rest/v1/movies?select=id,title,year,studio,country,country_flag,duration,actors,telegram_url&order=id.desc&limit=30`;
      
      try {
        const res = await fetch(endpoint, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        const movies = await res.json();
        document.getElementById('movie-count').innerText = `${movies.length} новинок`;

        const grid = document.getElementById('catalog-grid');
        grid.innerHTML = '';

        movies.forEach(m => {
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => showMovieDetails(m);

          card.innerHTML = `
            <div class="poster-box">
              <span class="card-year">${m.year || ''}</span>
              <div>
                <div class="poster-icon">🎬</div>
                <div class="poster-title-preview">${m.title || 'Фильм'}</div>
              </div>
            </div>
            <div class="card-info">
              <div class="card-title">${m.title || 'Без названия'}</div>
              <div class="card-meta">
                ${m.country_flag ? m.country_flag + ' ' : ''}${m.studio || 'The Sinners'}
              </div>
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (e) {
        document.getElementById('movie-count').innerText = 'Ошибка загрузки';
      }
    }

    function showMovieDetails(m) {
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();

      document.getElementById('sheet-title').innerText = m.title || 'Без названия';
      
      const meta = document.getElementById('sheet-meta');
      meta.innerHTML = `
        ${m.year ? `<div class="sheet-meta-item">📅 ${m.year}</div>` : ''}
        ${m.duration ? `<div class="sheet-meta-item">⏱ ${m.duration}</div>` : ''}
        ${m.country ? `<div class="sheet-meta-item">${m.country_flag || ''} ${m.country}</div>` : ''}
        ${m.studio ? `<div class="sheet-meta-item">🏢 ${m.studio}</div>` : ''}
      `;

      const actorsEl = document.getElementById('sheet-actors');
      actorsEl.innerHTML = m.actors ? `<span>В ролях:</span> ${m.actors}` : '';

      currentTelegramUrl = m.telegram_url || '';
      document.getElementById('sheet-overlay').classList.add('active');
    }

    function closeSheet(e) {
      document.getElementById('sheet-overlay').classList.remove('active');
    }

    function openChannelPost() {
      if (!currentTelegramUrl) {
        alert('Ссылка на пост ещё не заполнена в базе');
        return;
      }
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      // Открываем нативный пост Telegram в канале
      if (tg?.openTelegramLink) {
        tg.openTelegramLink(currentTelegramUrl);
      } else {
        window.open(currentTelegramUrl, '_blank');
      }
    }

    loadCatalog();
  </script>
</body>
</html>
